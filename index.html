<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>플라이바이 발표</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#080f17; }
    iframe { display:block; width:100%; height:100%; border:0; }
  </style>
</head>
<body>
  <iframe id="presentation" src="./presentation/" title="플라이바이 발표" allow="fullscreen"></iframe>
  <script>
    const presentation = document.getElementById('presentation');

    /** 프레임 로드 후 Space·Shift 등의 키 입력을 실제 발표 화면으로 연결함. */
    function focusPresentation() {
      presentation.contentWindow.focus();
    }

    presentation.addEventListener('load', focusPresentation);
  </script>
</body>
</html>
